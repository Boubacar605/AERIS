# Configuration Alembic — migrations du schéma du moteur de décision.
#
# L'URL de connexion n'est pas figée ici : alembic/env.py la lit depuis la
# configuration du moteur (variable DATABASE_URL), comme l'application.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Le schéma de référence est initialement construit par les scripts
# /infrastructure/postgres/init/*.sql au premier démarrage du conteneur.
# Alembic prend le relais pour toute évolution ultérieure du schéma.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
