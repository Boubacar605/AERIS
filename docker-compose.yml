services:
  # ===== SERVICES CLOUD =====
  service-tuberculose-cloud:
    build: ./services/service-tuberculose
    container_name: aeris-tb-cloud
    restart: unless-stopped
    ports:
      - "${SERVICE_TB_PORT:-8001}:8001"
    environment:
      - SERVICE_TB_PORT=8001
      - SERVICE_TB_CHEMIN_MODELE_EDGE=/app/modeles_entraines/modele_tuberculose.h5
      - SERVICE_TB_CHEMIN_MODELE_CLOUD=/app/modeles_entraines/modele_tuberculose_cloud.h5
      - MODE_DEPLOIEMENT=cloud
    volumes:
      - ./services/service-tuberculose/modeles_entraines:/app/modeles_entraines
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/sante"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - cloud
      - complet
    networks:
      - aeris-reseau

  service-pneumonie-cloud:
    build: ./services/service-pneumonie
    container_name: aeris-pn-cloud
    restart: unless-stopped
    ports:
      - "${SERVICE_PN_PORT:-8002}:8002"
    environment:
      - SERVICE_PN_PORT=8002
      - SERVICE_PN_CHEMIN_MODELE_EDGE=/app/modeles_entraines/modele_pneumonie.h5
      - SERVICE_PN_CHEMIN_MODELE_CLOUD=/app/modeles_entraines/modele_pneumonie_cloud.h5
      - MODE_DEPLOIEMENT=cloud
    volumes:
      - ./services/service-pneumonie/modeles_entraines:/app/modeles_entraines
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/sante"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - cloud
      - complet
    networks:
      - aeris-reseau

  # ===== SERVICES EDGE (ressources limitees) =====
  service-tuberculose-edge:
    build: ./services/service-tuberculose
    container_name: aeris-tb-edge
    restart: unless-stopped
    ports:
      - "8011:8001"
    environment:
      - SERVICE_TB_PORT=8001
      - SERVICE_TB_CHEMIN_MODELE_EDGE=/app/modeles_entraines/modele_tuberculose.h5
      - SERVICE_TB_CHEMIN_MODELE_CLOUD=/app/modeles_entraines/modele_tuberculose_cloud.h5
      - MODE_DEPLOIEMENT=edge
    volumes:
      - ./services/service-tuberculose/modeles_entraines:/app/modeles_entraines
    deploy:
      resources:
        limits:
          cpus: "${EDGE_LIMITE_CPU:-1.0}"
          memory: "${EDGE_LIMITE_MEMOIRE:-512m}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/sante"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - edge
      - complet
    networks:
      - aeris-reseau

  service-pneumonie-edge:
    build:
      context: ./services/service-pneumonie
      dockerfile: Dockerfile.edge
    container_name: aeris-pn-edge
    restart: unless-stopped
    ports:
      - "8012:8002"
    environment:
      - SERVICE_PN_PORT=8002
      - SERVICE_PN_CHEMIN_MODELE_EDGE=/app/modeles_entraines/modele_pneumonie.h5
      - SERVICE_PN_CHEMIN_MODELE_CLOUD=/app/modeles_entraines/modele_pneumonie_cloud.h5
      - MODE_DEPLOIEMENT=edge
    volumes:
      - ./services/service-pneumonie/modeles_entraines:/app/modeles_entraines
    deploy:
      resources:
        limits:
          cpus: "${EDGE_LIMITE_CPU:-1.0}"
          memory: "${EDGE_LIMITE_MEMOIRE:-512m}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/sante"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - edge
      - complet
    networks:
      - aeris-reseau

  # ===== MOTEUR DE DECISION =====
  moteur-decision:
    build: ./services/moteur-decision
    container_name: aeris-moteur-decision
    restart: unless-stopped
    ports:
      - "${MOTEUR_DECISION_PORT:-8003}:8003"
    environment:
      - MOTEUR_DECISION_PORT=8003
      - DATABASE_URL=postgresql+psycopg://aeris:${POSTGRES_PASSWORD:-aeris_demo}@postgres:5432/aeris
      - URL_SERVICE_TB_EDGE=http://service-tuberculose-edge:8001
      - URL_SERVICE_TB_CLOUD=http://service-tuberculose-cloud:8001
      - URL_SERVICE_PN_EDGE=http://service-pneumonie-edge:8002
      - URL_SERVICE_PN_CLOUD=http://service-pneumonie-cloud:8002
      - PROMETHEUS_URL=http://prometheus:9090
      - SEUIL_CPU=${SEUIL_CPU:-80}
      - SEUIL_RAM=${SEUIL_RAM:-85}
      - SEUIL_LATENCE_MS=${SEUIL_LATENCE_MS:-100}
      - PROFILAGE_ACTIVE=${PROFILAGE_ACTIVE:-true}
    depends_on:
      service-tuberculose-cloud:
        condition: service_started
        required: false
      service-pneumonie-cloud:
        condition: service_started
        required: false
      service-tuberculose-edge:
        condition: service_started
        required: false
      service-pneumonie-edge:
        condition: service_started
        required: false
      prometheus:
        condition: service_started
        required: false
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/sante"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - cloud
      - edge
      - complet
    networks:
      - aeris-reseau

  # ===== MONITORING =====
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: aeris-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-donnees:/prometheus
    profiles:
      - monitoring
      - complet
    networks:
      - aeris-reseau

  # ===== PERSISTANCE (PostgreSQL) =====
  postgres:
    image: postgres:16-alpine
    container_name: aeris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeris_demo}
      POSTGRES_DB: aeris
    volumes:
      - aeris-postgres-donnees:/var/lib/postgresql/data
      # Scripts d'init exécutés UNIQUEMENT au premier boot du volume :
      # 01-types, 02-schema, 03-triggers, 04-vues, 05-seed.
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeris -d aeris"]
      interval: 5s
      timeout: 3s
      retries: 12
    profiles:
      - complet
    networks:
      - aeris-reseau

  # ===== TABLEAU DE BORD =====
  tableau-de-bord:
    build:
      context: ./tableau-de-bord
      args:
        # URL du moteur de décision accessible depuis le navigateur distant.
        # Peut être surchargée via VITE_URL_API_PUBLIQUE (ex. : un tunnel
        # Cloudflare) : VITE_URL_API_PUBLIQUE=https://xxx.trycloudflare.com
        # (nom VITE_URL_API_BUILD pour éviter le no-op ENV/ARG de BuildKit)
        VITE_URL_API_BUILD: ${VITE_URL_API_PUBLIQUE:-http://localhost:${MOTEUR_DECISION_PORT:-8003}}
    container_name: aeris-tableau-de-bord
    restart: unless-stopped
    ports:
      - "${TABLEAU_DE_BORD_PORT:-3000}:3000"
    profiles:
      - complet
    networks:
      - aeris-reseau

volumes:
  prometheus-donnees:
  aeris-postgres-donnees:

networks:
  aeris-reseau:
    driver: bridge
