# AERIS — Reverse proxy unifie (frontend + backend)
# Expose le tableau de bord (3000) et le moteur (8003) sur un seul port.
# Utilise par Tailscale Funnel pour une URL publique stable.

server {
    listen 8080;

    # --- API : le moteur de decision (port 8003) ---
    # /api/routage/analyser -> http://localhost:8003/routage/analyser
    location /api/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        client_max_body_size 20m;
    }

    # --- Frontend : le tableau de bord (port 3000) ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
